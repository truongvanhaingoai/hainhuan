<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Họ Trương Văn | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="hero-overlay">
            <h1>HỌ TRƯƠNG TỘC</h1>
            <p class="tagline">Hải Nhuận • Hải Ngoại</p>
            <p class="vietnamese-tagline">Lưu giữ truyền thống • Tưởng nhớ tổ tiên • Kết nối các thế hệ</p>
        </div>
    </header>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Trương Văn</div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="active">Home</a>
                <a href="history.html">History</a>
                <a href="family.html">Family Tree</a>
                <a href="gallery.html">Gallery</a>
                <a href="video.html">Videos</a>
                <a href="events.html">Events</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="section-heading">
            <span>GET IN TOUCH</span>
            <h2>Liên Hệ</h2>
            <div class="divider"></div>
        </div>
        <form class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="form-group">
                <label for="name">Your Name / Họ Tên</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message / Lời Nhắn</label>
                <textarea id="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </main>

    <footer><p>© 2026 Họ Trương Văn. All Rights Reserved.</p></footer>
    <script src="script.js"></script>
</body>
</html>
